services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrator:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
    - DB_HOST=db
    - DB_USER=${DB_USER}
    - DB_NAME=${DB_NAME}
    - DB_PASSWORD=${DB_PASSWORD}
    working_dir: /app
    volumes:
      - ./migrations:/app/migrations

volumes:
  db_data: